name: Release Hearth

# Fork release flow: bump `improvedVersion` in server/src/constants.ts, merge to
# main, then dispatch this workflow. It tags main as v<version>, publishes a
# GitHub Release, and dispatches the Docker workflow against the tag so images
# are pushed to ghcr.io tagged v<version> and v<major>.
#
# The release and the follow-up dispatch both use the built-in GITHUB_TOKEN.
# Events created with GITHUB_TOKEN never trigger other workflows, which is why
# the Docker workflow is dispatched explicitly instead of relying on the
# `release: published` trigger.

on:
  workflow_dispatch:

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release
      actions: write # dispatch the Docker workflow for the tag
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main

      - name: Read fork version
        id: version
        run: |
          version=$(sed -n "s/^export const improvedVersion = '\(.*\)';$/\1/p" server/src/constants.ts)
          if [[ -z "${version}" ]]; then
            echo "Could not read improvedVersion from server/src/constants.ts" >&2
            exit 1
          fi
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "${TAG}" --repo "${REPO}" > /dev/null 2>&1; then
            echo "Release ${TAG} already exists; bump improvedVersion in server/src/constants.ts first" >&2
            exit 1
          fi
          gh release create "${TAG}" \
            --repo "${REPO}" \
            --target main \
            --title "Hearth ${TAG}" \
            --generate-notes

      - name: Build release images
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh workflow run docker.yml --repo "${REPO}" --ref "${TAG}"
