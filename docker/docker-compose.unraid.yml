#
# Compose stack for running Hearth (rshaker2-ops/Hearth) on an Unraid server.
# This file matches the real deployment: media on /photos, external libraries,
# and the live PG16 database - it is not a generic template.
#
# Usage (with the "Docker Compose Manager" plugin from Community Applications):
#   1. Create a new stack and paste this file as its compose file.
#   2. Copy example.unraid.env next to it as `.env` and adjust the values.
#   3. Compose Up. The web UI is served on port 2283.
#
# Images are published from this fork's main branch by CI:
#   ghcr.io/rshaker2-ops/hearth-server:main
#   ghcr.io/rshaker2-ops/hearth-machine-learning:main
# Pin IMMICH_VERSION in .env to a release tag (e.g. v1.1.0) for reproducible upgrades.

name: hearth

services:
  hearth-server:
    container_name: hearth_server
    image: ghcr.io/rshaker2-ops/hearth-server:${IMMICH_VERSION:-main}
    # extends:
    #   file: hwaccel.transcoding.yml
    #   service: cpu # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding (quicksync for Intel iGPU)
    environment:
      # Uploaded media lives under the /photos mount below, NOT the default /data.
      # This must match the media location recorded in the database - do not change it.
      IMMICH_MEDIA_LOCATION: /photos
    volumes:
      - /mnt/user/data/media/photos:/photos
      - /mnt/user/photos:/libraries
      - '/mnt/user/nextcloud/Rob Shaker/files/Pics and vids:/mnt/media/RobS'
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - '2283:2283'
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  hearth-machine-learning:
    container_name: hearth_machine_learning
    networks:
      default:
        # Keep the upstream service hostname resolvable: the machine learning URL
        # stored in the server's system config references immich-machine-learning.
        aliases:
          - immich-machine-learning
    # For hardware acceleration, add one of -[armnn, cuda, rocm, openvino, rknn] to the image tag.
    # Example tag: ${IMMICH_VERSION:-main}-cuda
    image: ghcr.io/rshaker2-ops/hearth-machine-learning:${IMMICH_VERSION:-main}
    # extends: # uncomment this section for hardware acceleration - see https://docs.immich.app/features/ml-hardware-acceleration
    #   file: hwaccel.ml.yml
    #   service: cpu # set to one of [armnn, cuda, rocm, openvino, openvino-wsl, rknn] for accelerated inference
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: hearth_redis
    image: docker.io/valkey/valkey:9@sha256:3acc0687f2a2e1091fae6450d7842dd658c941338cf0a873ddd9e14b9e4ea4dd
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  database:
    container_name: hearth_postgres
    # PG16: the database directory below was initialized with Postgres 16 - do not downgrade this image.
    image: ghcr.io/immich-app/postgres:16-vectorchord0.4.3-pgvector0.8.0-pgvectors0.3.0
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      # IMPORTANT (Unraid): Postgres must NOT live on the FUSE-backed /mnt/user path -
      # this is a direct cache path, and it holds the live database.
      - /mnt/cache/appdata/PostgreSQL_Immich:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always

volumes:
  model-cache:
