#
# Compose stack for running Hearth (rshaker2-ops/hearth) on an Unraid server.
#
# Usage (with the "Docker Compose Manager" plugin from Community Applications):
#   1. Create a new stack and paste this file as its compose file.
#   2. Copy example.unraid.env next to it as `.env` and adjust the values.
#   3. Compose Up. The web UI is served on port 2283.
#
# Images are published from this fork's main branch by CI:
#   ghcr.io/rshaker2-ops/hearth-server:main
#   ghcr.io/rshaker2-ops/hearth-machine-learning:main
# Pin IMMICH_VERSION in .env to a release tag (e.g. v1.1.0) for reproducible upgrades.

name: hearth

services:
  hearth-server:
    container_name: hearth_server
    image: ghcr.io/rshaker2-ops/hearth-server:${IMMICH_VERSION:-main}
    # extends:
    #   file: hwaccel.transcoding.yml
    #   service: cpu # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding (quicksync for Intel iGPU)
    volumes:
      # Do not edit the next line. If you want to change the media storage location on your system, edit the value of UPLOAD_LOCATION in the .env file
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - '2283:2283'
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  hearth-machine-learning:
    container_name: hearth_machine_learning
    networks:
      default:
        # Keep the upstream service hostname resolvable: the machine learning URL
        # stored in the server's system config references immich-machine-learning.
        aliases:
          - immich-machine-learning
    # For hardware acceleration, add one of -[armnn, cuda, rocm, openvino, rknn] to the image tag.
    # Example tag: ${IMMICH_VERSION:-main}-cuda
    image: ghcr.io/rshaker2-ops/hearth-machine-learning:${IMMICH_VERSION:-main}
    # extends: # uncomment this section for hardware acceleration - see https://docs.immich.app/features/ml-hardware-acceleration
    #   file: hwaccel.ml.yml
    #   service: cpu # set to one of [armnn, cuda, rocm, openvino, openvino-wsl, rknn] for accelerated inference
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: hearth_redis
    image: docker.io/valkey/valkey:9@sha256:3acc0687f2a2e1091fae6450d7842dd658c941338cf0a873ddd9e14b9e4ea4dd
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  database:
    container_name: hearth_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # Uncomment the DB_STORAGE_TYPE: 'HDD' var if your database isn't stored on SSDs
      # DB_STORAGE_TYPE: 'HDD'
    volumes:
      # Do not edit the next line. If you want to change the database storage location on your system, edit the value of DB_DATA_LOCATION in the .env file
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false

volumes:
  model-cache:
